<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação de Cursos - Senac Amazonas</title>
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    #preloader { position: fixed; inset: 0; background-color: #ffffff; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease, visibility 0.4s ease; }
    #preloader.hidden-loader { opacity: 0; visibility: hidden; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #004582; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo-preta { filter: brightness(0); }
  </style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">

  <div id="preloader">
    <div class="flex flex-col items-center max-w-sm text-center px-4">
      <img src="https://am.senac.br/wp-content/themes/senac/images/logo-senac.png" alt="Senac Logo" class="h-16 mb-6 object-contain logo-preta">
      <div class="spinner mb-5"></div>
      <h2 id="loader-title" class="text-base font-bold text-slate-800 mb-1">A carregar base de dados...</h2>
      <p class="text-xs text-slate-500 font-medium mb-12">Isto pode demorar alguns segundos.</p>
      <span class="text-[11px] font-semibold text-slate-400">Powered by Glauco Soprano</span>
    </div>
  </div>

  <main class="w-full max-w-md bg-white rounded-2xl border border-slate-200 p-6 md:p-8 shadow-xl space-y-6">
    <div class="flex flex-col items-center text-center space-y-3">
      <img src="https://am.senac.br/wp-content/themes/senac/images/logo-senac.png" alt="Senac Logo" class="h-12 object-contain logo-preta">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Avaliação de Cursos</h1>
        <p class="text-xs text-slate-500 font-medium mt-1">Informe o código da sua turma e selecione o docente.</p>
      </div>
    </div>

    <form id="antissala-form" class="space-y-4" onsubmit="event.preventDefault(); iniciarAvaliacao();">
      <div>
        <label for="cursoInput" class="block text-xs font-semibold text-slate-700 mb-1">Código da Turma / Curso</label>
        <input type="text" id="cursoInput" list="listaTurmas" placeholder="Digite ou selecione o código da turma..." oninput="exibirNomeDoCurso()" onchange="validarSelecaoCurso()" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-all bg-slate-50 font-medium text-slate-800">
        <datalist id="listaTurmas"></datalist>
        <div id="cursoInfoContainer" class="hidden mt-2 p-2.5 bg-indigo-50/80 border border-indigo-100 rounded-lg text-xs space-y-1">
          <div>
            <span class="text-slate-500 block text-[10px] uppercase font-bold tracking-wider">Curso Identificado:</span>
            <span id="nomeCursoDisplay" class="font-semibold text-indigo-950 block mt-0.5"></span>
          </div>
          <div class="pt-1 border-t border-indigo-100/80 flex items-center justify-between">
            <span class="text-slate-500 text-[10px] uppercase font-bold tracking-wider">Unidade Operativa:</span>
            <span id="unidadeDisplay" class="font-semibold text-indigo-900 text-xs"></span>
          </div>
        </div>
      </div>
      <div>
        <label for="docenteInput" class="block text-xs font-semibold text-slate-700 mb-1">Docente (Professor)</label>
        <input type="text" id="docenteInput" list="listaDocentes" placeholder="Digite ou selecione o nome do professor..." onchange="validarSelecaoDocente()" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-all bg-slate-50 font-medium text-slate-800">
        <datalist id="listaDocentes"></datalist>
      </div>
      <button type="submit" id="btnIniciar" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md transition-colors duration-200 mt-2">Iniciar Avaliação</button>
    </form>
    <div class="text-center border-t border-slate-100 pt-4">
      <span class="text-[11px] font-semibold text-slate-400">Gerência de Desenvolvimento Educacional - Senac AM</span>
    </div>
  </main>

  <script>
    const formsBaseUrl = "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=VYz8K3TflEuoWng2wpkRuMvJDVHkwjVIplsiTqqUZX9UMU4ySTdRNUc1UFpVSTM1T1I5Q0YyMjVJMi4u";
    
    // ATENÇÃO: COLOQUE AQUI A URL "RAW" DO SEU ARQUIVO dados.json NO GITHUB
    const jsonUrl = "COLE_AQUI_O_SEU_LINK_RAW"; 

    let bancoDeTurmas = [];
    let bancoDeDocentes = [];

    async function carregarDadosExternos() {
      try {
        if(jsonUrl === "https://raw.githubusercontent.com/glauco288/avaliacao-senac/refs/heads/main/dados.json"){
            alert("Atenção: A URL do GitHub não foi configurada no código HTML. Altere a variável jsonUrl.");
            return;
        }

        const response = await fetch(jsonUrl);
        if (!response.ok) throw new Error("Erro de rede: " + response.status);
        const data = await response.json();
        
        bancoDeTurmas = data.turmas || [];
        bancoDeDocentes = data.docentes || [];

        // Preenche Autocomplete de Turmas/Cursos
        const datalistTurmas = document.getElementById('listaTurmas');
        bancoDeTurmas.forEach(item => {
          const option = document.createElement('option');
          option.value = item.codigo;
          option.text = `${item.codigo} - ${item.nome}`;
          datalistTurmas.appendChild(option);
        });

        // Preenche Autocomplete de Docentes
        const datalistDocentes = document.getElementById('listaDocentes');
        bancoDeDocentes.forEach(docente => {
          const option = document.createElement('option');
          option.value = docente;
          datalistDocentes.appendChild(option);
        });

        // Oculta o preloader
        const loader = document.getElementById('preloader');
        if (loader) loader.classList.add('hidden-loader');

      } catch (err) {
        console.error("Erro ao puxar dados do GitHub:", err);
        document.getElementById('loader-title').textContent = "Falha na conexão.";
        document.getElementById('loader-title').classList.add("text-red-600");
      }
    }

    function exibirNomeDoCurso() {
      const valorDigitado = document.getElementById('cursoInput').value.trim().toLowerCase();
      const containerInfo = document.getElementById('cursoInfoContainer');
      const displayNome = document.getElementById('nomeCursoDisplay');
      const displayUnidade = document.getElementById('unidadeDisplay');

      const turmaEncontrada = bancoDeTurmas.find(item => item.codigo.toLowerCase() === valorDigitado);

      if (turmaEncontrada) {
        displayNome.textContent = turmaEncontrada.nome;
        displayUnidade.textContent = turmaEncontrada.unidade;
        containerInfo.classList.remove('hidden');
      } else {
        containerInfo.classList.add('hidden');
      }
    }

    function validarSelecaoCurso() {
      const input = document.getElementById('cursoInput');
      const valor = input.value.trim().toLowerCase();
      if (!valor) return;
      if (!bancoDeTurmas.some(item => item.codigo.toLowerCase() === valor)) {
        alert("⚠️ Seleção Inválida!\nPor favor, escolha um Código de Turma que esteja na lista.");
        input.value = '';
        exibirNomeDoCurso();
      }
    }

    function validarSelecaoDocente() {
      const input = document.getElementById('docenteInput');
      const valor = input.value.trim().toLowerCase();
      if (!valor) return;
      if (!bancoDeDocentes.some(d => d.toLowerCase() === valor)) {
        alert("⚠️ Seleção Inválida!\nPor favor, escolha um Professor que esteja na lista.");
        input.value = '';
      }
    }

    function iniciarAvaliacao() {
      const codDig = document.getElementById('cursoInput').value.trim();
      const docDig = document.getElementById('docenteInput').value.trim();

      if (!codDig || !docDig) {
        alert("Por favor, preencha o Código da Turma e selecione o Docente.");
        return;
      }
      const turmaObjeto = bancoDeTurmas.find(item => item.codigo.toLowerCase() === codDig.toLowerCase());
      if (!turmaObjeto) {
        alert("Código de turma não encontrado na base.");
        document.getElementById('cursoInput').value = '';
        return;
      }
      if (!bancoDeDocentes.some(d => d.toLowerCase() === docDig.toLowerCase())) {
        alert("Docente inválido. Selecione um professor da lista.");
        document.getElementById('docenteInput').value = '';
        return;
      }

      const urlFinal = `${formsBaseUrl}&re1ff1bb2eb8e4aea899a0b1300f93458=${encodeURIComponent(turmaObjeto.unidade)}&r2680abcaed03412ba6e06cddc7d7b2ab=${encodeURIComponent(codDig)}&r9bc36f4e0dc6411c9d341654b9b86e13=${encodeURIComponent(turmaObjeto.nome)}&r6f7b7c50f26147fc935aa093bafcc0d4=${encodeURIComponent(docDig)}`;
      window.location.href = urlFinal;
    }

    window.onload = carregarDadosExternos;
  </script>
</body>
</html>
