<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação Institucional - Antissala</title>
  
  <!-- Tailwind CSS & Google Fonts (DM Sans) -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'DM Sans', sans-serif; }

    /* PRELOADER ANIMADO */
    #preloader {
      position: fixed; inset: 0; background-color: #ffffff; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #preloader.hidden-loader { opacity: 0; visibility: hidden; }
    .spinner { 
      width: 32px; height: 32px; 
      border: 3px solid #e2e8f0; border-top-color: #004582; 
      border-radius: 50%; animation: spin 0.8s linear infinite; 
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo-preta { filter: brightness(0); }
  </style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">

  <!-- PRELOADER DE CARREGAMENTO DOS DADOS -->
  <div id="preloader">
    <div class="flex flex-col items-center max-w-sm text-center px-4">
      <img src="https://am.senac.br/wp-content/themes/senac/images/logo-senac.png" alt="Senac Logo" class="h-16 mb-6 object-contain logo-preta">
      <div class="spinner mb-5"></div>
      <h2 id="loader-title" class="text-base font-bold text-slate-800 mb-1">Carregando Turmas e Docentes...</h2>
      <p class="text-xs text-slate-500 font-medium mb-12">Gerência de Desenvolvimento Educacional</p>
      <span class="text-[11px] font-semibold text-slate-400">Powered by Glauco Soprano - Supervisor Técnico</span>
    </div>
  </div>

  <!-- CARD DA ANTISSALA -->
  <main class="w-full max-w-md bg-white rounded-2xl border border-slate-200 p-6 md:p-8 shadow-xl space-y-6">
    
    <!-- CABEÇALHO COM LOGO INSTITUCIONAL -->
    <div class="flex flex-col items-center text-center space-y-3">
      <img src="https://am.senac.br/wp-content/themes/senac/images/logo-senac.png" alt="Senac Logo" class="h-12 object-contain logo-preta">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Avaliação Institucional</h1>
        <p class="text-xs text-slate-500 font-medium mt-1">Informe o código da sua turma e selecione o docente.</p>
      </div>
    </div>

    <!-- FORMULÁRIO DE SELEÇÃO -->
    <form id="antissala-form" class="space-y-4" onsubmit="event.preventDefault(); iniciarAvaliacao();">
      
      <!-- CAMPO DE BUSCA PELO CÓDIGO DA TURMA -->
      <div>
        <label for="cursoInput" class="block text-xs font-semibold text-slate-700 mb-1">Código da Turma</label>
        <input 
          type="text" 
          id="cursoInput" 
          list="listaTurmas" 
          placeholder="Ex: 2026.2.107, 2026.2.182..." 
          disabled 
          oninput="exibirNomeDoCurso()"
          class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-all bg-slate-50 disabled:opacity-50 font-medium text-slate-800"
        >
        <datalist id="listaTurmas">
          <!-- Preenchido via JS com os códigos -->
        </datalist>

        <!-- INFORMACÕES DA TURMA IDENTIFICADA -->
        <div id="cursoInfoContainer" class="hidden mt-2 p-2.5 bg-indigo-50/80 border border-indigo-100 rounded-lg text-xs space-y-1">
          <div>
            <span class="text-slate-500 block text-[10px] uppercase font-bold tracking-wider">Curso Identificado:</span>
            <span id="nomeCursoDisplay" class="font-semibold text-indigo-950 block mt-0.5"></span>
          </div>
          <div class="pt-1 border-t border-indigo-100/80 flex items-center justify-between">
            <span class="text-slate-500 text-[10px] uppercase font-bold tracking-wider">Unidade Operativa:</span>
            <span id="unidadeDisplay" class="font-semibold text-indigo-900 text-xs"></span>
          </div>
        </div>
      </div>

      <!-- SELETOR DE DOCENTE -->
      <div>
        <label for="docenteSelect" class="block text-xs font-semibold text-slate-700 mb-1">Docente (Professor)</label>
        <select 
          id="docenteSelect" 
          disabled 
          class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition-all bg-slate-50 disabled:opacity-50 font-medium text-slate-800"
        >
          <option value="">Aguarde o carregamento...</option>
        </select>
      </div>

      <!-- BOTÃO DE AÇÃO -->
      <button 
        type="submit" 
        id="btnIniciar" 
        disabled 
        class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold text-sm rounded-xl shadow-md transition-colors duration-200 mt-2"
      >
        Iniciar Avaliação
      </button>

    </form>

    <div class="text-center border-t border-slate-100 pt-4">
      <span class="text-[11px] font-semibold text-slate-400">Gerência de Desenvolvimento Educacional - Senac AM</span>
    </div>

  </main>

  <script>
    // Dicionário de Links do Microsoft Forms por Unidade Operativa
    // Substitua as URLs de exemplo pelas URLs base pré-preenchidas reais de cada unidade
    const linksFormsPorUnidade = {
      "CEP Fernando A. Pequeno Franco": "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=VYz8K3TflEuoWng2wpkRuEHJoITf4ytAq_d0ngTT7xNUNVdSQTVZU1c3WUlXVk9aS0NSVzJPMElaRC4u",
      "CEP Manaus": "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=URL_DO_FORMS_MANAUS",
      "CEP Parintins": "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=URL_DO_FORMS_PARINTINS",
      "CEP Coari": "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=URL_DO_FORMS_COARI",
      "CEP Itacoatiara": "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=URL_DO_FORMS_ITACOATIARA",
      "CEP Tefé": "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=URL_DO_FORMS_TEFE",
      // Adicione as demais Unidades Operativas conforme necessário
    };

    const siteUrl = "https://senacam.sharepoint.com/sites/gde_dep";
    let bancoDeTurmas = [];

    // Ocultar / Exibir Preloader
    function setPreloaderVisible(visible, message = "Carregando Turmas e Docentes...") {
      const loader = document.getElementById('preloader');
      const loaderTitle = document.getElementById('loader-title');
      if (loaderTitle) loaderTitle.textContent = message;

      if (visible) {
        loader.classList.remove('hidden-loader');
      } else {
        setTimeout(() => {
          loader.classList.add('hidden-loader');
        }, 600);
      }
    }

    // Leitura das Listas do Microsoft Lists / SharePoint via API REST
    async function carregarDados() {
      setPreloaderVisible(true);
      try {
        // 1. Busca da Lista de Turmas
        const resTurmas = await fetch(`${siteUrl}/_api/web/lists/getbytitle('RelatorioDadosDaTurma')/items?$top=1000`, {
          headers: { "Accept": "application/json;odata=verbose" }
        });
        const dataTurmas = await resTurmas.json();
        bancoDeTurmas = dataTurmas.d.results;

        const datalist = document.getElementById('listaTurmas');
        datalist.innerHTML = '';
        
        bancoDeTurmas.forEach(item => {
          const codigo = (item.C_x00f3_digo_x0020_da_x0020_Turma || '').trim();
          if (codigo) {
            const option = document.createElement('option');
            option.value = codigo;
            datalist.appendChild(option);
          }
        });

        // 2. Busca da Lista de Docentes
        const resDocentes = await fetch(`${siteUrl}/_api/web/lists/getbytitle('Lista_Docentes')/items?$top=1000`, {
          headers: { "Accept": "application/json;odata=verbose" }
        });
        const dataDocentes = await resDocentes.json();
        const docentes = dataDocentes.d.results;

        const docenteSelect = document.getElementById('docenteSelect');
        docenteSelect.innerHTML = '<option value="">Selecione o(a) docente...</option>';

        docentes.forEach(item => {
          const option = document.createElement('option');
          option.value = item.Title;
          option.text = item.Title;
          docenteSelect.appendChild(option);
        });

        // Habilita os componentes da tela após o carregamento
        document.getElementById('cursoInput').disabled = false;
        document.getElementById('docenteSelect').disabled = false;
        document.getElementById('btnIniciar').disabled = false;

      } catch (err) {
        console.error("Erro ao conectar ao SharePoint:", err);
        alert("Houve um erro ao carregar as informações das turmas e docentes. Recarregue a página.");
      } finally {
        setPreloaderVisible(false);
      }
    }

    // Identifica e exibe o Nome do Curso e a Unidade Operativa correspondentes ao Código digitado
    function exibirNomeDoCurso() {
      const valorDigitado = document.getElementById('cursoInput').value.trim();
      const containerInfo = document.getElementById('cursoInfoContainer');
      const displayNome = document.getElementById('nomeCursoDisplay');
      const displayUnidade = document.getElementById('unidadeDisplay');

      const turmaEncontrada = bancoDeTurmas.find(item => {
        const codigo = (item.C_x00f3_digo_x0020_da_x0020_Turma || '').trim();
        return codigo.toLowerCase() === valorDigitado.toLowerCase();
      });

      if (turmaEncontrada) {
        displayNome.textContent = turmaEncontrada.Nome_x0020_da_x0020_Turma || 'Curso sem nome cadastrado';
        
        // Pega a Unidade Operativa da coluna do SharePoint
        const unidade = turmaEncontrada.Unidade_x0020_Operativa || turmaEncontrada.UnidadeOperativa || turmaEncontrada.Unidade || 'Não informada';
        displayUnidade.textContent = unidade;

        containerInfo.classList.remove('hidden');
      } else {
        containerInfo.classList.add('hidden');
        displayNome.textContent = '';
        displayUnidade.textContent = '';
      }
    }

    // Redirecionamento e geração do Link do Forms da Unidade Pré-preenchido
    function iniciarAvaliacao() {
      const codigoTurmaDigitado = document.getElementById('cursoInput').value.trim();
      const docenteSelect = document.getElementById('docenteSelect').value;

      if (!codigoTurmaDigitado || !docenteSelect) {
        alert("Por favor, preencha o Código da Turma e selecione o Docente antes de prosseguir.");
        return;
      }

      // Localiza a turma no banco do SharePoint
      const turmaObjeto = bancoDeTurmas.find(item => {
        const codigo = (item.C_x00f3_digo_x0020_da_x0020_Turma || '').trim();
        return codigo.toLowerCase() === codigoTurmaDigitado.toLowerCase();
      });

      if (!turmaObjeto) {
        alert("Código de turma não encontrado. Verifique o número digitado.");
        return;
      }

      const codigoTurma = codigoTurmaDigitado;
      const nomeCurso = turmaObjeto.Nome_x0020_da_x0020_Turma || '';
      const unidadeOperativa = (turmaObjeto.Unidade_x0020_Operativa || turmaObjeto.UnidadeOperativa || turmaObjeto.Unidade || '').trim();

      // Busca a URL do Forms para a Unidade Operativa encontrada (ou usa o padrão)
      const formsBaseUrl = linksFormsPorUnidade[unidadeOperativa] || linksFormsPorUnidade["CEP Fernando A. Pequeno Franco"];

      // Injeção dos parâmetros nos IDs do Forms
      const urlFinal = `${formsBaseUrl}` + 
        `&r2680abcaed03412ba6e06cddc7d7b2ab=${encodeURIComponent(codigoTurma)}` +
        `&r9bc36f4e0dc6411c9d341654b9b86e13=${encodeURIComponent(nomeCurso)}` +
        `&r6f7b7c50f26147fc935aa093bafcc0d4=${encodeURIComponent(docenteSelect)}`;

      // Redireciona o aluno direto para o Forms da unidade dele
      window.location.href = urlFinal;
    }

    window.onload = carregarDados;
  </script>
</body>
</html>
